version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sympet_php
    volumes:
      - .:/var/www/html
    networks:
      - sympet-network

  web:
    image: nginx:alpine
    container_name: sympet_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - sympet-network

  db:
    image: mysql:8.0
    container_name: sympet_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sympet
      MYSQL_USER: sympet_user
      MYSQL_PASSWORD: sympet_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sympet-network

networks:
  sympet-network:
    driver: bridge

volumes:
  db_data:
